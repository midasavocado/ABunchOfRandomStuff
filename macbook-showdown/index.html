<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MacBook Showdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Marker"; src: url(assets/fonts/permanent-marker-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url(assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(assets/fonts/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
  @font-face { font-family: "Mono"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
  :root {
    --ink: #07060d;
    --red: #ff3b5c; --red2: #b3123a;
    --blue: #3d8bff; --blue2: #1446c9;
    --gold: #ffcc4d; --gold2: #ff9a2e;
    --o: #0e0b19;
    --display: "Anton", Impact, sans-serif;
    --body: "Inter", system-ui, sans-serif;
    --hand: "Marker", "Comic Sans MS", cursive;
    --mono: "Mono", ui-monospace, monospace;
    --goldtext: linear-gradient(180deg, #fff6c9 0%, #ffd766 38%, #f5a623 62%, #fff0a8 100%);
    --chrome: linear-gradient(180deg, #ffffff 0%, #e9ecf5 42%, #9aa3b8 55%, #f4f6fb 100%);
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--body); color: #fff; }
  #viewport { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #shake, #cam { position: absolute; inset: 0; }
  .c { position: absolute; left: 0; top: 0; }
  .fill { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .scene > *, .fill > * { position: absolute; }
  img.emo { position: absolute; left: 0; top: 0; display: block; filter: drop-shadow(0 18px 24px rgba(0,0,0,.45)); }

  .bg2d { background: radial-gradient(1100px 700px at 50% 40%, #221b45 0%, #0b0917 60%, #05040a 100%); }
  .rays { width: 2800px; height: 2800px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,204,77,.16) 0deg 7deg, rgba(255,204,77,0) 7deg 14deg); }

  .big { font-family: var(--display); text-transform: uppercase; line-height: .9; white-space: nowrap; letter-spacing: .005em; }
  .gold { background: var(--goldtext); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #7a3f06) drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
  .chrome { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 #2a2f45) drop-shadow(0 16px 28px rgba(0,0,0,.6)); }
  .white { color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.55); }
  .word { display: inline-block; }
  .hand { font-family: var(--hand); white-space: nowrap; text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 10px 24px rgba(0,0,0,.5); }
  .eyebrow { font: 900 24px/1 var(--body); letter-spacing: .34em; text-transform: uppercase; white-space: nowrap; }
  .sub { font: 600 32px/1.2 var(--body); white-space: nowrap; }
  .fine { font: 600 21px/1.45 var(--body); color: rgba(255,255,255,.6); }
  .glass { background: linear-gradient(180deg, rgba(40,36,70,.78), rgba(14,12,28,.84)); border: 1.5px solid rgba(255,255,255,.18); border-radius: 22px;
           box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18); }
  .pill { display: inline-flex; align-items: center; gap: 12px; padding: 14px 26px; border-radius: 999px; font: 800 34px/1 var(--body); white-space: nowrap; }
  .pill.red { background: linear-gradient(180deg, #ff5a75, #d81e45); box-shadow: 0 10px 30px rgba(255,59,92,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .pill.blue { background: linear-gradient(180deg, #5aa2ff, #1f5fe0); box-shadow: 0 10px 30px rgba(61,139,255,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .pill.gold { background: linear-gradient(180deg, #ffe07a, #f5a623); color: #2a1600; box-shadow: 0 10px 30px rgba(255,204,77,.35), inset 0 1px 0 rgba(255,255,255,.5); }
  .pill.dark { background: rgba(10,8,20,.78); border: 1.5px solid rgba(255,255,255,.22); }
  .stamp { position: absolute; font: 400 110px/1 var(--display); color: #ff3355; border: 11px solid #ff3355; border-radius: 20px; padding: 6px 28px 12px;
           letter-spacing: .04em; white-space: nowrap; background: rgba(20,4,10,.6); box-shadow: 0 0 40px rgba(255,51,85,.35); }
  .stamp.green { color: #3ee08a; border-color: #3ee08a; box-shadow: 0 0 40px rgba(62,224,138,.35); background: rgba(4,20,12,.6); }

  .callout { position: absolute; left: 0; top: 0; }
  .callout .lab { position: absolute; padding: 16px 24px 18px; white-space: nowrap; }
  .callout .lab .k { font: 900 18px/1 var(--body); letter-spacing: .26em; text-transform: uppercase; opacity: .7; }
  .callout .lab .v { font: 800 40px/1.05 var(--body); margin-top: 8px; }
  svg.lines { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  #hud { position: absolute; left: 960px; top: 30px; display: flex; align-items: stretch; border-radius: 20px; overflow: hidden;
         box-shadow: 0 20px 40px rgba(0,0,0,.5), 0 0 0 1.5px rgba(255,255,255,.2); font: 800 26px/1 var(--body); }
  #hud .team { display: flex; align-items: center; padding: 14px 22px; letter-spacing: .02em; }
  #hud .red { background: linear-gradient(180deg, #ff5a75, #c9173d); }
  #hud .blue { background: linear-gradient(180deg, #5aa2ff, #1a55d6); }
  #hud .score { font: 400 50px/1 var(--display); padding: 6px 20px; background: linear-gradient(180deg, #fff, #dfe3ee); color: var(--o); min-width: 52px; display: flex; align-items: center; justify-content: center; }
  #hud .mid { background: rgba(8,6,16,.92); padding: 14px 22px; font: 900 20px/1 var(--body); letter-spacing: .24em; display: flex; align-items: center; color: var(--gold); }

  .rc { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
  .rc .bgc { position: absolute; inset: 0; background: radial-gradient(1000px 700px at 50% 50%, #3a2a08 0%, #120c02 55%, #050300 100%); }
  .rc .n { font: 400 300px/.85 var(--display); }
  .rc .t { font: 400 130px/1 var(--display); letter-spacing: .02em; }

  #wipe { position: absolute; inset: 0; pointer-events: none; }
  #wipe div { position: absolute; top: -10%; height: 120%; width: 150%; left: -25%; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #fxcanvas { position: absolute; inset: 0; pointer-events: none; }
  #grain { position: absolute; inset: -60px; opacity: .05; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%); }
  .bubble { position: absolute; background: #fff; color: var(--o); border-radius: 30px; padding: 18px 30px; font: 400 46px/1 var(--hand); white-space: nowrap; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  .receipt { position: absolute; background: linear-gradient(180deg, #fffdf6, #f6f1e4); color: #222; font: 700 30px/1 var(--mono); box-shadow: 0 40px 70px rgba(0,0,0,.55); }
  .receipt .row { display: flex; justify-content: space-between; padding: 0 44px; height: 54px; align-items: center; white-space: nowrap; }
  .receipt .row .ck { color: #13a35a; margin-right: 14px; }
  .receipt hr { border: 0; border-top: 4px dashed #c9c2b0; margin: 12px 44px; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="bg" class="fill">
      <div class="fill" style="background:radial-gradient(1400px 800px at 50% 30%, #1d1838 0%, #0c0a18 55%, #05040a 100%)"></div>
      <div id="glowL" class="fill" style="opacity:0;background:radial-gradient(900px 760px at 8% 38%, rgba(255,45,85,.55), rgba(255,45,85,0) 70%)"></div>
      <div id="glowR" class="fill" style="opacity:0;background:radial-gradient(900px 760px at 92% 38%, rgba(47,123,255,.6), rgba(47,123,255,0) 70%)"></div>
      <div id="glowC" class="fill" style="opacity:0;background:radial-gradient(1000px 700px at 50% 30%, rgba(255,201,60,.45), rgba(255,201,60,0) 70%)"></div>
      <div id="spotlight" class="fill" style="opacity:0;background:conic-gradient(from 180deg at 50% -10%, rgba(255,255,255,0) 160deg, rgba(255,246,220,.14) 180deg, rgba(255,255,255,0) 200deg)"></div>
      <div class="fill" style="top:58%;background:linear-gradient(180deg, rgba(0,0,0,0), rgba(3,2,8,.55) 30%, rgba(3,2,8,.85))"></div>
    </div>
    <canvas id="gl" width="1920" height="1080"></canvas>
    <div id="xdr" class="c" style="width:1500px;height:1100px;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(closest-side, rgba(235,244,255,1), rgba(170,205,255,.55) 38%, rgba(90,140,255,.18) 65%, rgba(0,0,0,0));mix-blend-mode:screen"></div>
    <div id="shake"><div id="cam"></div></div>
    <div id="lines" class="fill" style="pointer-events:none"></div>
    <canvas id="fxcanvas" width="1920" height="1080"></canvas>
    <div id="hud">
      <div class="team red">13″ M1</div><div class="score" id="scR">0</div>
      <div class="mid" id="rnd">ROUND 1</div>
      <div class="score" id="scB">0</div><div class="team blue">M1 PRO 14″</div>
    </div>
    <div id="pluslayer" class="fill" style="pointer-events:none"></div>
    <div id="wipe"><div style="background:linear-gradient(90deg,#ff3b5c,#ff7a8f)"></div><div style="background:linear-gradient(90deg,#ffcc4d,#fff0a8)"></div><div style="background:linear-gradient(90deg,#3d8bff,#8ab8ff)"></div></div>
    <div id="flash"></div>
    <div id="grain"></div>
    <div id="vignette"></div>
    <div id="black"></div>
  </div>
</div>
<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/stage.js"></script>
<script src="cues.js"></script>
<script>
"use strict";
window.READY = [];
// =============================================================================================
// Timing. One paused GSAP timeline holds every move; renderAt(t) draws any moment exactly.
// =============================================================================================
const C = window.CUES;
const tl = gsap.timeline({ paused: true });
const PROCS = [], SFX = [], MUSIC = [];
const proc = f => PROCS.push(f);
const sfx = (name, t, gain = 1, opt = {}) => SFX.push({ name, t: +t.toFixed(4), gain, ...opt });
const L = id => C.lines[id].start, D = id => C.lines[id].dur, E = id => L(id) + D(id);
const S = id => C.scenes[id].start, SE = id => C.scenes[id].end;
// when a word is spoken: characters are spread over the speech segments, breaks snapped to punctuation
function W(id, word, k = 0) {
  const ln = C.lines[id], txt = ln.text;
  const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
  let idx = -1, m; for (let i = 0; i <= k; i++) { m = re.exec(txt); idx = m ? m.index : -1; }
  if (idx < 0) throw new Error('word ' + word + ' not in ' + id);
  const total = ln.segs.reduce((s, [a, b]) => s + b - a, 0);
  const breaks = [0]; txt.replace(/[,.?!]\s+/g, (m, o) => { breaks.push(o + m.length); return m; }); breaks.push(txt.length);
  const bounds = [0]; let acc = 0;
  for (let i = 0; i < ln.segs.length - 1; i++) {
    acc += ln.segs[i][1] - ln.segs[i][0];
    const want = txt.length * acc / total;
    bounds.push(breaks.filter(b => b > bounds[bounds.length - 1]).reduce((a, b) => Math.abs(b - want) < Math.abs(a - want) ? b : a, txt.length));
  }
  bounds.push(txt.length);
  for (let i = 0; i < ln.segs.length; i++) {
    if (idx < bounds[i + 1] || i === ln.segs.length - 1) {
      const [a, b] = ln.segs[i];
      return ln.start + a + (b - a) * Math.min(1, (idx - bounds[i]) / Math.max(1, bounds[i + 1] - bounds[i]));
    }
  }
  return E(id);
}
const sceneIds = Object.keys(C.scenes);
const nextStart = id => { const i = sceneIds.indexOf(id); return i + 1 < sceneIds.length ? S(sceneIds[i + 1]) : C.total + 1; };

// =============================================================================================
// DOM helpers
// =============================================================================================
const $ = s => document.querySelector(s);
const cam = $('#cam');
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || cam).appendChild(e);
  return e;
}
function at(e, x, y, extra = {}) { if (getComputedStyle(e).position === 'static') e.style.position = 'absolute'; gsap.set(e, { left: x, top: y, xPercent: -50, yPercent: -50, ...extra }); return e; }
const FL = n => n.includes('/') ? n : `assets/fluent/${n}_3d.png`;
function emo(name, size, parent, x, y) {
  const i = el('img', 'emo', parent); i.src = FL(name); i.width = i.height = size;
  at(i, x, y); return i;
}
const G = { on: 1 };
function scene(id, { gl = true } = {}) {
  const s = el('div', 'scene', cam); s.id = 's-' + id;
  tl.set(s, { visibility: 'visible' }, S(id));
  tl.set(s, { visibility: 'hidden' }, nextStart(id));
  tl.set(G, { on: gl ? 1 : 0 }, S(id));
  return s;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function popIn(e, t, o = {}) {
  tl.fromTo(e, { scale: o.from ?? 0.2, opacity: 0, rotation: o.rot ?? 0, y: o.y ?? 0 },
    { scale: o.to ?? 1, opacity: 1, rotation: o.rotTo ?? 0, y: 0, duration: o.dur ?? 0.45, ease: o.ease ?? 'back.out(2.2)' }, t);
  if (o.sfx !== false) sfx(o.sfx || 'pop', t, o.gain ?? 0.6);
}
function fadeOut(els, t, o = {}) { tl.to(els, { opacity: 0, y: o.y ?? -30, duration: o.dur ?? 0.3, ease: 'power2.in', stagger: o.stagger ?? 0 }, t); }
function slideIn(e, t, dx, dy, o = {}) {
  tl.fromTo(e, { x: dx, y: dy, opacity: o.fade ? 0 : 1 }, { x: 0, y: 0, opacity: 1, duration: o.dur ?? 0.55, ease: o.ease ?? 'power3.out' }, t);
  if (o.sfx !== false) sfx(o.sfx || 'whoosh', t - 0.05, o.gain ?? 0.5);
}
function slam(e, t, o = {}) {
  const d = o.dur ?? 0.22;
  tl.fromTo(e, { scale: o.from ?? 2.6, opacity: 0, rotation: o.rot ?? 0 }, { scale: 1, opacity: 1, rotation: o.rotTo ?? 0, duration: d, ease: 'power4.in' }, t);
  shake(t + d, o.amp ?? 16, 0.45);
  if (o.sfx !== false) sfx(o.sfx || 'slam', t + d - 0.02, o.gain ?? 0.8);
}
function words(parent, text, x, y, size, cls = 'white') {
  const box = el('div', 'big ' + cls, parent); box.style.fontSize = size + 'px'; box.style.textAlign = 'center';
  const ws = text.split(' ').map((w, i, a) => { const s = el('span', 'word', box, w); if (i < a.length - 1) s.style.marginRight = '0.2em'; return s; });
  at(box, x, y); return { box, ws };
}
function counter(e, from, to, t, dur, fmt = v => Math.round(v).toLocaleString('en-US')) {
  const o = { v: from }; tl.to(o, { v: to, duration: dur, ease: 'power2.out' }, t);
  proc(() => { const s = fmt(o.v); if (e.textContent !== s) e.textContent = s; });
}

// camera shake (applies to the DOM layer and the 3D canvas)
const SHAKES = [];
function shake(t, amp = 14, dur = 0.4) { SHAKES.push({ t, amp, dur }); }
proc(t => {
  let x = 0, y = 0, r = 0;
  for (const s of SHAKES) {
    const d = t - s.t; if (d < 0 || d > s.dur) continue;
    const k = s.amp * Math.pow(1 - d / s.dur, 2);
    x += k * Math.sin(d * 71 + s.t * 13); y += k * Math.sin(d * 57 + 1.7 + s.t * 7); r += k * 0.04 * Math.sin(d * 43);
  }
  $('#shake').style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`;
  $('#gl').style.transform = x || y ? `translate(${x * 0.7}px,${y * 0.7}px) rotate(${r * 0.7}deg) scale(1.015)` : '';
});
proc(t => { $('#grain').style.transform = `translate(${(Math.floor(t * 24) * 37) % 60 - 30}px,${(Math.floor(t * 24) * 53) % 60 - 30}px)`; });

// particles (bursts and emitters), all computed from t
const fx = $('#fxcanvas').getContext('2d');
const BURSTS = [], EMITTERS = [];
const CONFETTI = ['#ff3b5c', '#3d8bff', '#ffcc4d', '#ffffff', '#35d07f', '#b36bff'];
function burst(o) { BURSTS.push(Object.assign({ n: 40, speed: 900, spread: Math.PI * 2, angle: -Math.PI / 2, g: 1400, life: 1.4, size: 16, colors: CONFETTI, seed: BURSTS.length * 97 + 11, shape: 'rect', drag: 0.9 }, o)); }
function emitter(o) { EMITTERS.push(Object.assign({ rate: 60, life: 0.6, speed: 300, spread: 0.6, angle: Math.PI / 2, g: 0, size: 18, colors: ['#ffd23f', '#ff8a1f', '#ff4a1f'], shape: 'circle', seed: 7 + EMITTERS.length * 31 }, o)); }
function drawParticle(p, x, y, a, rot, size, color) {
  fx.globalAlpha = Math.max(0, a); fx.fillStyle = color;
  if (p.shape === 'circle') { fx.beginPath(); fx.arc(x, y, size / 2, 0, Math.PI * 2); fx.fill(); }
  else if (p.shape === 'glow') { const g = fx.createRadialGradient(x, y, 0, x, y, size); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)'); fx.fillStyle = g; fx.fillRect(x - size, y - size, size * 2, size * 2); }
  else if (p.shape === 'star') { fx.save(); fx.translate(x, y); fx.rotate(rot); fx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? size * 0.22 : size * 0.55, an = i * Math.PI / 5; fx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } fx.fill(); fx.restore(); }
  else { fx.save(); fx.translate(x, y); fx.rotate(rot); fx.scale(1, Math.abs(Math.cos(rot * 1.7)) * 0.8 + 0.2); fx.fillRect(-size / 2, -size / 3, size, size * 0.66); fx.restore(); }
}
proc(t => {
  fx.clearRect(0, 0, 1920, 1080);
  for (const b of BURSTS) {
    const d = t - b.t; if (d < 0 || d > b.life) continue;
    const r = mulberry(b.seed);
    for (let i = 0; i < b.n; i++) {
      const an = b.angle + (r() - 0.5) * b.spread, sp = b.speed * (0.35 + r() * 0.65);
      const k = (1 - Math.pow(b.drag, d * 10)) / (1 - b.drag) / 10;
      const x = b.x + Math.cos(an) * sp * k, y = b.y + Math.sin(an) * sp * k + 0.5 * b.g * d * d;
      const rot = r() * 6 + d * (r() - 0.5) * 18, size = b.size * (0.6 + r() * 0.8), col = b.colors[Math.floor(r() * b.colors.length)];
      drawParticle(b, x, y, d > b.life * 0.7 ? 1 - (d - b.life * 0.7) / (b.life * 0.3) : 1, rot, size, col);
    }
  }
  for (const e of EMITTERS) {
    if (t < e.t0 || t > e.t1 + e.life) continue;
    if (e.add) fx.globalCompositeOperation = 'lighter';
    const first = Math.max(0, Math.ceil((t - e.life - e.t0) * e.rate)), last = Math.floor((Math.min(t, e.t1) - e.t0) * e.rate);
    const pos = typeof e.pos === 'function' ? e.pos : () => e.pos;
    for (let i = first; i <= last; i++) {
      const born = e.t0 + i / e.rate, d = t - born; if (d < 0 || d > e.life) continue;
      const r = mulberry(e.seed * 1000 + i); const [ox, oy] = pos(born);
      const an = e.angle + (r() - 0.5) * e.spread, sp = e.speed * (0.5 + r() * 0.5);
      const x = ox + (r() - 0.5) * (e.jitter || 0) + Math.cos(an) * sp * d, y = oy + Math.sin(an) * sp * d + 0.5 * e.g * d * d;
      const f = d / e.life, size = e.size * (e.shrink === false ? 1 : 1 - f * 0.8) * (0.6 + r() * 0.6);
      drawParticle(e, x, y, (1 - f) * (e.alpha ?? 1), r() * 6 + d * 8, size, e.colors[Math.floor(r() * e.colors.length)]);
    }
    fx.globalCompositeOperation = 'source-over';
  }
  fx.globalAlpha = 1;
});

// =============================================================================================
// The 3D stage
// =============================================================================================
const ST = window.STAGE_CREATE($('#gl'), JSON.parse(new URLSearchParams(location.search).get('o') || '{}'));
const LAP = ST.laptops, THREE = ST.THREE;

    stars.forEach((sp, i) => { const an = q * 4 + i * 2.1; sp.visible = !!kst.on; sp.position.set(g.position.x + Math.cos(an) * 1.1, 0.5 + Math.sin(q * 6 + i) * 0.05, g.position.z + Math.sin(an) * 0.5); });
  });
  // winner
  const tw = L('a08') - 0.1;
  tl.to(ko, { opacity: 0, y: -80, duration: 0.25 }, tw - 0.2);
  screen('14', tw, faceScreen('partying_face', { size: 0.62 }));
  move(tw, 0.6, '14', [0.9, 0, 0], -0.2);
  tl.to(LAP['14'].group.position, { y: 0.35, duration: 0.8, ease: 'power2.out' }, tw + 0.2);
  tl.to(LAP['14'].group.rotation, { y: -0.2 + Math.PI * 2, duration: 5.5, ease: 'power1.inOut' }, tw + 0.5);
  glovesOff('14', tw + 0.1);
  shot(tw, 1.4, [0.3, 1.6, 7.9], [0.8, 1.95, 0]);
  lights(tw, 0.6, { gC: 1.1, gL: 0.2, gR: 0.9, rimL: 20, top: 200, bloom: 0.7 });
  const crown = ST.sprite(FL('crown'), 0.9);
  LAP['14'].lidPivot.add(crown); crown.position.set(0, 0.2, LAP['14'].D + 0.25); crown.material.opacity = 0;
  tl.fromTo(crown.position, { y: 2.5 }, { y: 0.2, duration: 0.6, ease: 'bounce.out', immediateRender: false }, W('a08', 'Pro') - 0.1);
  tl.to(crown.material, { opacity: 1, duration: 0.1 }, W('a08', 'Pro') - 0.1);
  sfx('ding', W('a08', 'Pro') + 0.35, 0.8);
  const win = el('div', 'big gold', s, 'WINNER'); win.style.fontSize = '210px'; at(win, 960, 170);
  slam(win, tw + 0.1, { from: 2.6, rot: -6, rotTo: -2, amp: 22 });
  sfx('crowd', tw + 0.1, 0.55, { dur: 4 }); sfx('fanfare', tw + 0.2, 0.55);
  burst({ t: tw + 0.3, x: 360, y: 1080, n: 130, speed: 2300, angle: -Math.PI / 2 + 0.35, spread: 0.7, size: 22, life: 3, g: 1100, drag: 0.8 });
  burst({ t: tw + 0.3, x: 1560, y: 1080, n: 130, speed: 2300, angle: -Math.PI / 2 - 0.35, spread: 0.7, size: 22, life: 3, g: 1100, drag: 0.8 });
  emitter({ t0: tw + 0.8, t1: E('n21'), rate: 45, life: 3.5, speed: 60, angle: Math.PI / 2, spread: 1, size: 22, shape: 'rect', colors: CONFETTI, pos: [960, -40], jitter: 2000, g: 120, shrink: false });
  const nm = el('div', 'pill blue', s, '14″ MacBook Pro · M1 Pro'); nm.style.fontSize = '38px'; at(nm, 960, 960);
  popIn(nm, W('a08', 'fourteen') - 0.1, { from: 0.4 });
  const tg = L('n21') - 0.2;
  tl.to([win, nm], { opacity: 0, duration: 0.25 }, tg);
  const dy = el('div', 'big white', s, 'DYLAN,'); dy.style.fontSize = '120px'; at(dy, 960, 110);
  const get = el('div', 'big gold', s, 'GET THE 14″'); get.style.fontSize = '220px'; at(get, 960, 275);
  popIn(dy, tg, { from: 0.5, dur: 0.3 });
  slam(get, W('n21', 'Get') - 0.15, { from: 2.2, rot: -4, rotTo: -2, amp: 16 });
  const thanks = [['eyes', 'your eyes', 'eyes'], ['assets/fluent/ear_3d_default.png', 'your ears', 'ears'], ['assets/fluent/raising_hands_3d_default.png', 'future you', 'future']].map(([c, label, w], i) => {
    const g = el('div', 'glass', s, `<div style="display:flex;align-items:center;gap:16px;padding:12px 30px 12px 16px"><img src="${FL(c)}" width="84" height="84"><span style="font:800 40px/1 var(--body)">${label}</span></div>`);
    g.style.borderRadius = '999px'; at(g, 560 + i * 400, 960);
    popIn(g, W('n21', w) - 0.15, { from: 0.4 }); return g;
  });
  const thx = el('div', 'hand', s, 'will thank you'); thx.style.cssText += ';font-size:52px;color:var(--gold)'; at(thx, 960, 1045);
  popIn(thx, W('n21', 'thank') - 0.1, { rot: -3, rotTo: -2, sfx: false });
  const tf = L('n22') - 0.3;
  fadeOut([...thanks, thx, dy], tf);
  tl.to(get, { scale: 0.6, y: -80, duration: 0.4, ease: 'power3.inOut' }, tf);
  shot(tf, 1.2, [-1.4, 1.2, 6.4], [-1.4, 0.6, 0]);
  const fp = el('div', 'hand', s, '*unless you really, really love the Touch Bar'); fp.style.cssText += ';font-size:54px;color:#fff'; at(fp, 960, 1000);
  popIn(fp, L('n22'), { rot: -2, rotTo: -1, from: 0.6, sfx: false });
  MUSIC.push({ type: 'duck', t: L('n22') - 0.1, until: E('n23') + 0.2, gain: 0.35 });
  const bub = el('div', 'bubble', s, `i do. <img src="${FL('loudly_crying_face')}" width="56" height="56" style="vertical-align:-12px">`);
  at(bub, 0, 0); follow(bub, '13', LAP['13'].group, 40, -210);
  popIn(bub, E('n23') + 0.05, { from: 0.3, rot: -6, rotTo: -4, sfx: 'pop2' });
  sfx('sadtrombone', E('n23') - 0.05, 0.75);
})();

// =============================================================================================
// END CARD
// =============================================================================================
(() => {
  const s = scene('end'), t0 = S('end');
  place(t0, '13', [0, 0, -40], 0, { visible: false });
  place(t0, '14', [2.2, 0.25, 0], -0.5, { lid: 106 });
  glovesOff('14', t0);
  cut(t0, [0, 1.3, 8.2], [0.6, 1.0, 0], { fov: 30 });
  shot(t0, 3, [0.4, 1.2, 7.6], [0.9, 1.0, 0], { ease: 'none' });
  tl.to(LAP['14'].group.rotation, { y: 0.1, duration: 3, ease: 'none' }, t0);
  lights(t0, 0.01, { gC: 0.9, gL: 0, gR: 0.8, rimL: 0, rimR: 100, top: 160, bloom: 0.5 });
  screen('14', t0, faceScreen('smiling_face_with_sunglasses', { size: 0.62 }));
  flash(t0, 0.6, 0.4);
  const k = el('div', 'eyebrow', s, 'The verdict'); k.style.color = 'var(--gold)'; gsap.set(k, { left: 140, top: 250 });
  const h = el('div', 'big white', s, 'GET THE<br>14″ M1 PRO'); h.style.fontSize = '150px'; h.style.lineHeight = '.95'; gsap.set(h, { left: 140, top: 300 });
  const sub = el('div', 'hand', s, '$125 well spent, Dylan.'); sub.style.cssText += ';font-size:60px;color:var(--gold)'; gsap.set(sub, { left: 150, top: 610, rotation: -3 });
  const sc = el('div', 'c', s, `<div style="display:flex;align-items:center;border-radius:18px;overflow:hidden;font:400 64px/1 var(--display);box-shadow:0 20px 40px rgba(0,0,0,.5)">
     <span style="background:linear-gradient(180deg,#5aa2ff,#1a55d6);padding:14px 30px">14″ &nbsp;4</span><span style="background:#0e0b19;color:#aaa;padding:14px 20px;font-size:36px">vs</span><span style="background:linear-gradient(180deg,#ff5a75,#c9173d);padding:14px 30px">2 &nbsp;13″</span></div>`);
  gsap.set(sc, { left: 140, top: 730 });
  const fine = el('div', 'fine', s, 'Specs from Apple’s tech specs. Battery: “up to” hours, Apple TV app movie playback.<br>No MacBooks were harmed. One Touch Bar’s feelings were hurt.');
  gsap.set(fine, { left: 140, top: 900 });
  slideIn(k, t0 + 0.05, -80, 0, { fade: true, sfx: false }); slam(h, t0 + 0.1, { from: 1.8, amp: 12 });
  popIn(sub, t0 + 0.5, { rot: -5, rotTo: -3, sfx: 'pop2' }); popIn(sc, t0 + 0.8, { from: 0.5 });
  tl.fromTo(fine, { opacity: 0 }, { opacity: 1, duration: 0.5 }, t0 + 1.2);
  tl.to('#black', { opacity: 1, duration: 0.8, ease: 'power1.in' }, C.total - 0.8);
})();

// =============================================================================================
// Rendering entry points
// =============================================================================================
tl.set({}, {}, C.total);
proc(() => {
  const g = LAP['14'].st.glow, x = $('#xdr');
  const a = G.on && LAP['14'].group.visible ? Math.max(0, Math.min(0.95, (g - 1.0) / 1.2)) : 0;
  x.style.opacity = a;
  if (a) { const p = ST.project(LAP['14'].anchors.screen); gsap.set(x, { left: p.x, top: p.y, xPercent: -50, yPercent: -50 }); }
});
window.renderAt = t => {
  tl.seek(t, false);
  ST.prepare(t);   // camera first, so everything pinned to the 3D scene lines up this frame
  for (const f of PROCS) f(t);
  $('#gl').style.visibility = G.on ? 'visible' : 'hidden';
  $('#bg').style.visibility = G.on ? 'visible' : 'hidden';
  if (G.on) ST.render(t);
};
window.getEvents = () => ({ sfx: SFX.slice().sort((a, b) => a.t - b.t), music: MUSIC, total: C.total, scenes: C.scenes });
window.ready = Promise.all([document.fonts.ready, ...window.READY, ...[...document.images].map(i => i.decode().catch(() => { }))]).then(() => new Promise(r => setTimeout(r, 300)));

// live preview in a browser (serve this folder over http): click to play with the soundtrack
const params = new URLSearchParams(location.search);
if (!params.has('render')) {
  const vp = $('#viewport');
  const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); vp.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  const audio = new Audio('assets/soundtrack.mp3');
  let t0 = null, playing = false;
  const loop = () => { const t = !audio.paused ? audio.currentTime : (performance.now() - t0) / 1000; renderAt(Math.min(t, C.total)); if (t < C.total) requestAnimationFrame(loop); else playing = false; };
  const start = () => { if (playing) return; playing = true; audio.currentTime = 0; audio.play().catch(() => { }); t0 = performance.now(); requestAnimationFrame(loop); };
  window.ready.then(() => renderAt(+(params.get('t') || 11.8)));
  addEventListener('click', start); addEventListener('keydown', e => { if (e.key === ' ') start(); });
}
</script>
</body>
</html>
