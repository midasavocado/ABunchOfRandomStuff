<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MacBook Showdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "Anton"; src: url(assets/fonts/anton-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Marker"; src: url(assets/fonts/permanent-marker-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url(assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(assets/fonts/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
  @font-face { font-family: "Mono"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }

  :root {
    --ink: #0e0b1c;
    --ink2: #1a1533;
    --red: #ff4a5f;
    --red2: #c21d3c;
    --blue: #3f8cff;
    --blue2: #1a4fd1;
    --gold: #ffc93c;
    --gold2: #ff9d2e;
    --paper: #fff8ec;
    --o: #16112a;
    --display: "Anton", Impact, sans-serif;
    --body: "Inter", system-ui, sans-serif;
    --hand: "Marker", "Comic Sans MS", cursive;
    --mono: "Mono", ui-monospace, monospace;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: var(--body); color: #fff; }
  #viewport { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--ink); }
  .abs { position: absolute; left: 0; top: 0; }
  .fill { position: absolute; inset: 0; }
  .c { position: absolute; left: 0; top: 0; }
  #shake, #cam { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .scene > *, .fill > *, .panel > * { position: absolute; }
  img.emo { position: absolute; left: 0; top: 0; display: block; }

  #bg {
    background:
      radial-gradient(1200px 700px at 50% 38%, #2a2257 0%, rgba(26,21,51,0) 70%),
      radial-gradient(900px 900px at 50% 120%, #241a4a 0%, rgba(14,11,28,0) 70%),
      var(--ink);
  }
  .glowL { background: radial-gradient(900px 900px at 0% 50%, rgba(255,74,95,.45), rgba(255,74,95,0) 70%); opacity: 0; }
  .glowR { background: radial-gradient(900px 900px at 100% 50%, rgba(63,140,255,.45), rgba(63,140,255,0) 70%); opacity: 0; }
  .spot {
    position: absolute; top: -200px; width: 900px; height: 1500px; left: 510px;
    background: conic-gradient(from 180deg at 50% 0%, rgba(255,255,255,0) 168deg, rgba(255,247,220,.16) 180deg, rgba(255,255,255,0) 192deg);
    transform-origin: 50% 0%; mix-blend-mode: screen; opacity: 0;
  }
  #dust { position: absolute; inset: 0; }
  #grain { position: absolute; inset: -60px; opacity: .06; pointer-events: none; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #fxcanvas { position: absolute; inset: 0; pointer-events: none; }

  /* type */
  .big { font-family: var(--display); text-transform: uppercase; line-height: .92; letter-spacing: .005em; white-space: nowrap;
         text-shadow: 0 8px 0 rgba(0,0,0,.35); }
  .word { display: inline-block; }
  .hand { font-family: var(--hand); white-space: nowrap; }
  .eyebrow { font: 900 26px/1 var(--body); letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
  .sub { font: 600 34px/1.2 var(--body); white-space: nowrap; }
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 0; padding: 16px 28px; border-radius: 999px;
          font: 800 38px/1 var(--body); white-space: nowrap; color: #fff; background: rgba(8,6,20,.72);
          border: 4px solid rgba(255,255,255,.9); box-shadow: 0 10px 0 rgba(0,0,0,.35); }
  .chip.red { border-color: var(--red); }
  .chip.blue { border-color: var(--blue); }
  .chip b { font-weight: 900; }
  .chip img { width: 44px; height: 44px; margin-left: 12px; }
  .tag { font: 900 30px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; padding: 10px 18px; border-radius: 10px; white-space: nowrap; }
  .tag.red { background: var(--red); } .tag.blue { background: var(--blue); } .tag.gold { background: var(--gold); color: var(--o); }

  /* HUD scoreboard */
  #hud { position: absolute; left: 960px; top: 34px; display: flex; align-items: stretch;
         font: 800 30px/1 var(--body); border-radius: 22px; overflow: hidden; box-shadow: 0 10px 0 rgba(0,0,0,.35); border: 4px solid var(--o); }
  #hud .team { display: flex; align-items: center; gap: 12px; padding: 14px 22px; }
  #hud .red { background: var(--red); } #hud .blue { background: var(--blue); }
  #hud .score { font: 400 52px/1 var(--display); padding: 8px 22px; background: #fff; color: var(--o); min-width: 54px; text-align: center; display: flex; align-items: center; justify-content: center; }
  #hud .mid { background: var(--o); padding: 14px 22px; font: 900 22px/1 var(--body); letter-spacing: .2em; display: flex; align-items: center; color: var(--gold); }

  /* wipes */
  #wipe { position: absolute; inset: 0; pointer-events: none; }
  #wipe div { position: absolute; top: -10%; height: 120%; width: 150%; left: -25%; }

  /* round card */
  .rc { position: absolute; inset: 0; visibility: hidden; }
  .rc .dim { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(255,201,60,.35), rgba(14,11,28,.9) 70%); }
  .rc .card { position: absolute; left: 960px; top: 540px; width: 980px; height: 520px; margin: -260px 0 0 -490px;
              background: var(--gold); border: 10px solid var(--o); border-radius: 36px; box-shadow: 0 26px 0 rgba(0,0,0,.4);
              display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--o); }
  .rc .card .n { font: 400 230px/0.9 var(--display); letter-spacing: .01em; }
  .rc .card .t { font: 400 110px/1 var(--display); color: #fff; -webkit-text-stroke: 8px var(--o); paint-order: stroke fill; margin-top: 10px; }
  .rc .card .bolt { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--o); }

  /* misc components */
  .panel { position: absolute; inset: 0; }
  .card2 { position: absolute; background: var(--paper); color: var(--o); border: 8px solid var(--o); border-radius: 28px; box-shadow: 0 16px 0 rgba(0,0,0,.35); }
  .touchbar { position: absolute; border-radius: 26px; background: linear-gradient(#0b0b12, #17151f); border: 6px solid #2c2a36; overflow: hidden;
              box-shadow: 0 0 0 6px var(--o), 0 0 80px rgba(160,120,255,.45), inset 0 0 30px rgba(120,160,255,.25); }
  .touchbar .track { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; gap: 34px; padding-left: 40px; }
  .touchbar .track img { flex: none; }
  .screenbox { position: absolute; background: #0a0a10; border: 8px solid var(--o); border-radius: 34px; box-shadow: 0 18px 0 rgba(0,0,0,.35); overflow: hidden; }
  .screenbox .glass { position: absolute; overflow: hidden; border-radius: 12px; }
  .feedcard { position: absolute; left: 30px; right: 30px; height: 150px; border-radius: 20px; }
  .window { position: absolute; background: #1d1b29; border: 8px solid var(--o); border-radius: 26px; overflow: hidden; box-shadow: 0 16px 0 rgba(0,0,0,.35); }
  .window .bar { height: 54px; background: #2b2839; display: flex; align-items: center; gap: 12px; padding: 0 20px; font: 800 24px/1 var(--body); color: #cfc9e6; }
  .window .bar i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
  .receipt { position: absolute; background: #fffdf7; color: #222; font: 700 31px/1 var(--mono); box-shadow: 0 20px 0 rgba(0,0,0,.3); }
  .receipt .row { display: flex; justify-content: space-between; padding: 0 44px; height: 54px; align-items: center; white-space: nowrap; }
  .receipt .row .ck { color: #1aa35a; margin-right: 14px; }
  .receipt hr { border: 0; border-top: 4px dashed #bbb; margin: 12px 44px; }
  .stamp { position: absolute; font: 400 120px/1 var(--display); color: #e02843; border: 12px solid #e02843; border-radius: 22px; padding: 6px 30px 14px; letter-spacing: .04em; mix-blend-mode: multiply; white-space: nowrap; }
  .bubble { position: absolute; background: #fff; color: var(--o); border: 6px solid var(--o); border-radius: 30px; padding: 18px 30px; font: 400 44px/1 var(--hand); white-space: nowrap; }
  .fine { font: 600 22px/1.4 var(--body); color: rgba(255,255,255,.55); }
  .bar3 { position: absolute; height: 70px; border-radius: 16px; border: 6px solid var(--o); }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="bg" class="fill"></div>
    <div id="glowL" class="fill glowL"></div>
    <div id="glowR" class="fill glowR"></div>
    <div id="spot1" class="spot"></div>
    <div id="spot2" class="spot"></div>
    <canvas id="dust" width="1920" height="1080"></canvas>
    <div id="shake"><div id="cam"></div></div>
    <canvas id="fxcanvas" width="1920" height="1080"></canvas>
    <div id="hud">
      <div class="team red">13″ M1</div><div class="score" id="scR">0</div>
      <div class="mid" id="rnd">ROUND 1</div>
      <div class="score" id="scB">0</div><div class="team blue">M1 Pro 14″</div>
    </div>
    <div id="pluslayer" class="fill" style="pointer-events:none"></div>
    <div id="wipe"><div style="background:var(--red)"></div><div style="background:var(--gold)"></div><div style="background:var(--blue)"></div></div>
    <div id="flash"></div>
    <div id="grain"></div>
    <div id="vignette"></div>
    <div id="black"></div>
  </div>
</div>
<script src="assets/js/gsap.min.js"></script>
<script src="cues.js"></script>
<script>
"use strict";
window.READY = [];
// ---------------------------------------------------------------------------------------------
// Timing: everything is placed on one paused GSAP timeline and rendered with renderAt(t), so any
// frame can be drawn exactly (the video renderer steps through it frame by frame).
// ---------------------------------------------------------------------------------------------
const C = window.CUES;
const tl = gsap.timeline({ paused: true });
const PROCS = [], SFX = [], MUSIC = [];
const proc = f => PROCS.push(f);
const sfx = (name, t, gain = 1, opt = {}) => SFX.push({ name, t: +t.toFixed(4), gain, ...opt });
const L = id => C.lines[id].start, D = id => C.lines[id].dur, E = id => L(id) + D(id);
const S = id => C.scenes[id].start, SE = id => C.scenes[id].end;
const P = (id, f) => L(id) + D(id) * f;
// Time a word is spoken: spread the text's characters over the speech segments (pauses skipped).
function W(id, word, k = 0) {
  const ln = C.lines[id], txt = ln.text;
  const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g');
  let idx = -1, m; for (let i = 0; i <= k; i++) { m = re.exec(txt); idx = m ? m.index : -1; }
  if (idx < 0) throw new Error('word ' + word + ' not in ' + id);
  // Give each speech segment a run of characters: boundaries go where the speech time says,
  // snapped to the nearest punctuation break (pauses happen at commas and full stops).
  const total = ln.segs.reduce((s, [a, b]) => s + b - a, 0);
  const breaks = [0]; txt.replace(/[,.?!]\s+/g, (m, o) => { breaks.push(o + m.length); return m; }); breaks.push(txt.length);
  const bounds = [0]; let acc = 0;
  for (let i = 0; i < ln.segs.length - 1; i++) {
    acc += ln.segs[i][1] - ln.segs[i][0];
    const want = txt.length * acc / total;
    const snap = breaks.filter(b => b > bounds[bounds.length - 1]).reduce((a, b) => Math.abs(b - want) < Math.abs(a - want) ? b : a, txt.length);
    bounds.push(snap);
  }
  bounds.push(txt.length);
  for (let i = 0; i < ln.segs.length; i++) {
    if (idx < bounds[i + 1] || i === ln.segs.length - 1) {
      const [a, b] = ln.segs[i];
      return ln.start + a + (b - a) * Math.min(1, (idx - bounds[i]) / Math.max(1, bounds[i + 1] - bounds[i]));
    }
  }
  return E(id);
}
const sceneIds = Object.keys(C.scenes);
const nextStart = id => { const i = sceneIds.indexOf(id); return i + 1 < sceneIds.length ? S(sceneIds[i + 1]) : C.total + 1; };

// ---------------------------------------------------------------------------------------------
// DOM helpers
// ---------------------------------------------------------------------------------------------
const $ = s => document.querySelector(s);
const cam = $('#cam');
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || cam).appendChild(e);
  return e;
}
// centre an element on (x, y) using GSAP transforms
function at(e, x, y, extra = {}) { if (getComputedStyle(e).position === 'static') e.style.position = 'absolute'; gsap.set(e, { left: x, top: y, xPercent: -50, yPercent: -50, ...extra }); return e; }
function emo(code, size, parent, x, y) {
  const i = el('img', 'emo', parent); i.src = `assets/emoji/${code}.svg`; i.width = i.height = size;
  at(i, x, y); return i;
}
function scene(id) {
  const s = el('div', 'scene', cam); s.id = 's-' + id;
  tl.set(s, { visibility: 'visible' }, S(id));
  tl.set(s, { visibility: 'hidden' }, nextStart(id));
  return s;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// pop an element in / out
function popIn(e, t, o = {}) {
  tl.fromTo(e, { scale: o.from ?? 0.2, opacity: 0, rotation: o.rot ?? 0, y: o.y ?? 0 },
    { scale: o.to ?? 1, opacity: 1, rotation: o.rotTo ?? 0, y: 0, duration: o.dur ?? 0.45, ease: o.ease ?? 'back.out(2.2)' }, t);
  if (o.sfx !== false) sfx(o.sfx || 'pop', t, o.gain ?? 0.7);
}
function popOut(e, t, o = {}) {
  tl.to(e, { scale: o.scale ?? 0.4, opacity: 0, y: o.y ?? 0, x: o.x ?? 0, duration: o.dur ?? 0.3, ease: 'power2.in' }, t);
}
function slideIn(e, t, dx, dy, o = {}) {
  tl.fromTo(e, { x: dx, y: dy, opacity: o.fade ? 0 : 1 }, { x: 0, y: 0, opacity: 1, duration: o.dur ?? 0.55, ease: o.ease ?? 'power3.out' }, t);
  if (o.sfx !== false) sfx(o.sfx || 'whoosh', t - 0.05, o.gain ?? 0.6);
}
function slam(e, t, o = {}) {
  tl.fromTo(e, { scale: o.from ?? 2.6, opacity: 0, rotation: o.rot ?? 0 },
    { scale: 1, opacity: 1, rotation: o.rotTo ?? 0, duration: o.dur ?? 0.22, ease: 'power4.in' }, t);
  shake(t + (o.dur ?? 0.22), o.amp ?? 16, 0.45);
  if (o.sfx !== false) sfx(o.sfx || 'slam', t + (o.dur ?? 0.22) - 0.02, o.gain ?? 0.9);
}
// words that pop one by one, spread across a spoken line
function wordsLine(parent, text, x, y, size, color, o = {}) {
  const box = el('div', 'big', parent);
  box.style.fontSize = size + 'px'; box.style.color = color; box.style.textAlign = 'center';
  const words = text.split(' ').map(w => { const s = el('span', 'word', box, w); s.style.marginRight = '0.22em'; return s; });
  words[words.length - 1].style.marginRight = 0;
  at(box, x, y);
  return { box, words };
}

// ---------------------------------------------------------------------------------------------
// Camera shake (summed decaying noise), set by a proc
// ---------------------------------------------------------------------------------------------
const SHAKES = [];
function shake(t, amp = 14, dur = 0.4) { SHAKES.push({ t, amp, dur }); }
proc(t => {
  let x = 0, y = 0, r = 0;
  for (const s of SHAKES) {
    const d = t - s.t; if (d < 0 || d > s.dur) continue;
    const k = s.amp * Math.pow(1 - d / s.dur, 2);
    x += k * Math.sin(d * 71 + s.t * 13); y += k * Math.sin(d * 57 + 1.7 + s.t * 7); r += k * 0.04 * Math.sin(d * 43);
  }
  $('#shake').style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`;
});

// ---------------------------------------------------------------------------------------------
// Particles on a canvas: bursts and emitters, all computed from t (no state)
// ---------------------------------------------------------------------------------------------
const fx = $('#fxcanvas').getContext('2d');
const BURSTS = [];
const CONFETTI = ['#ff4a5f', '#3f8cff', '#ffc93c', '#ffffff', '#35d07f', '#b36bff'];
function burst(o) { BURSTS.push(Object.assign({ n: 40, speed: 900, spread: Math.PI * 2, angle: -Math.PI / 2, g: 1400, life: 1.4, size: 16, colors: CONFETTI, seed: BURSTS.length * 97 + 11, shape: 'rect', drag: 0.9 }, o)); }
// emitter: particles born at a steady rate between t0 and t1
const EMITTERS = [];
function emitter(o) { EMITTERS.push(Object.assign({ rate: 60, life: 0.6, speed: 300, spread: 0.6, angle: Math.PI / 2, g: 0, size: 18, colors: ['#ffd23f', '#ff8a1f', '#ff4a1f'], shape: 'circle', seed: 7 + EMITTERS.length * 31 }, o)); }
function drawParticle(p, x, y, a, rot, size, color) {
  fx.globalAlpha = a; fx.fillStyle = color;
  if (p.shape === 'circle') { fx.beginPath(); fx.arc(x, y, size / 2, 0, Math.PI * 2); fx.fill(); }
  else if (p.shape === 'star') { fx.save(); fx.translate(x, y); fx.rotate(rot); fx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? size * 0.22 : size * 0.55, an = i * Math.PI / 5; fx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } fx.fill(); fx.restore(); }
  else { fx.save(); fx.translate(x, y); fx.rotate(rot); fx.scale(1, Math.abs(Math.cos(rot * 1.7)) * 0.8 + 0.2); fx.fillRect(-size / 2, -size / 3, size, size * 0.66); fx.restore(); }
}
proc(t => {
  fx.clearRect(0, 0, 1920, 1080);
  for (const b of BURSTS) {
    const d = t - b.t; if (d < 0 || d > b.life) continue;
    const r = mulberry(b.seed);
    for (let i = 0; i < b.n; i++) {
      const an = b.angle + (r() - 0.5) * b.spread, sp = b.speed * (0.35 + r() * 0.65);
      const k = (1 - Math.pow(b.drag, d * 10)) / (1 - b.drag) / 10;  // drag-integrated distance
      const x = b.x + Math.cos(an) * sp * k, y = b.y + Math.sin(an) * sp * k + 0.5 * b.g * d * d;
      const rot = r() * 6 + d * (r() - 0.5) * 18, size = b.size * (0.6 + r() * 0.8), col = b.colors[Math.floor(r() * b.colors.length)];
      const a = d > b.life * 0.7 ? 1 - (d - b.life * 0.7) / (b.life * 0.3) : 1;
      drawParticle(b, x, y, a, rot, size, col);
    }
  }
  for (const e of EMITTERS) {
    if (t < e.t0 || t > e.t1 + e.life) continue;
    const first = Math.max(0, Math.ceil((t - e.life - e.t0) * e.rate)), last = Math.floor((Math.min(t, e.t1) - e.t0) * e.rate);
    const pos = typeof e.pos === 'function' ? e.pos : () => e.pos;
    for (let i = first; i <= last; i++) {
      const born = e.t0 + i / e.rate, d = t - born; if (d < 0 || d > e.life) continue;
      const r = mulberry(e.seed * 1000 + i); const [ox, oy] = pos(born);
      const an = e.angle + (r() - 0.5) * e.spread, sp = e.speed * (0.5 + r() * 0.5);
      const x = ox + (r() - 0.5) * (e.jitter || 0) + Math.cos(an) * sp * d, y = oy + Math.sin(an) * sp * d + 0.5 * e.g * d * d;
      const f = d / e.life, size = e.size * (e.shrink === false ? 1 : 1 - f * 0.8) * (0.6 + r() * 0.6);
      drawParticle(e, x, y, (1 - f) * (e.alpha ?? 1), r() * 6 + d * 8, size, e.colors[Math.floor(r() * e.colors.length)]);
    }
  }
  fx.globalAlpha = 1;
});

// floating dust in the light
(() => {
  const c = $('#dust').getContext('2d'), r = mulberry(5), P = [];
  for (let i = 0; i < 70; i++) P.push({ x: r() * 1920, y: r() * 1080, s: 1 + r() * 3, v: 6 + r() * 16, p: r() * 6 });
  proc(t => {
    c.clearRect(0, 0, 1920, 1080); c.fillStyle = '#fff';
    for (const p of P) { const y = (p.y - t * p.v) % 1080, yy = y < 0 ? y + 1080 : y; c.globalAlpha = 0.12 + 0.1 * Math.sin(t * 1.3 + p.p); c.beginPath(); c.arc(p.x + 20 * Math.sin(t * 0.3 + p.p), yy, p.s, 0, 7); c.fill(); }
  });
})();
proc(t => { $('#grain').style.transform = `translate(${(Math.floor(t * 24) * 37) % 60 - 30}px,${(Math.floor(t * 24) * 53) % 60 - 30}px)`; });
// swinging spotlights
proc(t => {
  $('#spot1').style.transform = `rotate(${18 + 9 * Math.sin(t * 0.7)}deg)`;
  $('#spot2').style.transform = `rotate(${-18 + 9 * Math.sin(t * 0.63 + 2)}deg)`;
});

// ---------------------------------------------------------------------------------------------
// The two fighters: SVG laptops with faces and boxing gloves
// ---------------------------------------------------------------------------------------------
let UID = 0;
const O = '#16112a';
const EXPR = {
