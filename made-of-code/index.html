<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Made of Code</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script id="src">
// ================================================================================
//  MADE OF CODE
//
//  Every glyph in this video is one character of this program.
//  The sphere, the galaxy, the words and the music are all drawn
//  by the text you are reading right now. No images. No audio files.
//  No video model. One file.
//
//  If you paused the video to read this: hi. You found the source.
// ================================================================================
'use strict';

const W = 1080, H = 1920, FPS = 30;
const BPM = 120, BEAT = 60 / BPM, BAR = 4 * BEAT;
const LEN = 16 * BAR;                          // 32 seconds, then it loops forever
const SR = 48000;
const RENDER = location.search.includes('render');

const MONO = '"DejaVu Sans Mono", Menlo, Consolas, monospace';
const SANS = '"DejaVu Sans", "Helvetica Neue", Arial, sans-serif';

// syntax colors: ident, keyword, string, number, comment, punctuation
const INK = ['#c8d3f5', '#ff79c6', '#a6e3a1', '#ffb86c', '#6c7a96', '#7dcfff'];
const BG = '#07080c';

// ---- small math -----------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

// seeded randomness, so every render of this video is identical
function rng(seed) {
  return () => {
    seed = seed + 0x6d2b79f5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- 1. read myself -------------------------------------------------------------
// The program loads its own text. That text becomes the particles.
const SOURCE = document.getElementById('src').textContent.replace(/^\n/, '');

function highlight(src) {
  const cls = new Uint8Array(src.length);
  const KW = new Set(('const let var function return if else for while of in new this ' +
    'async await true false null typeof break continue class').split(' '));
  let i = 0;
  while (i < src.length) {
    const c = src[i], n = src[i + 1];
    let j = i + 1, k = 5;
    if (c === '/' && n === '/') {
      j = src.indexOf('\n', i); if (j < 0) j = src.length; k = 4;
    } else if (c === "'" || c === '"' || c === '`') {
      while (j < src.length && src[j] !== c) j += src[j] === '\\' ? 2 : 1;
      j++; k = 2;
    } else if (/[0-9]/.test(c)) {
      while (/[0-9a-fx.]/i.test(src[j] || '')) j++;
      k = 3;
    } else if (/[A-Za-z_$]/.test(c)) {
      while (/[\w$]/.test(src[j] || '')) j++;
      k = KW.has(src.slice(i, j)) ? 1 : 0;
    }
    cls.fill(k, i, j); i = j;
  }
  return cls;
}

// ---- 2. lay the code out like an editor ------------------------------------------
const FONT = 16, LINE = 21, LEFT = 38;
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.font = `${FONT}px ${MONO}`;
const CW = g.measureText('M').width;

const P = [];                                  // one particle per visible character
{
  const cls = highlight(SOURCE), rand = rng(1234);
  let col = 0, row = 0;
  for (let i = 0; i < SOURCE.length; i++) {
    const ch = SOURCE[i];
    if (ch === '\n') { row++; col = 0; continue; }
    if (ch !== ' ') {
      P.push({ ch, ink: cls[i], hx: LEFT + (col + 0.5) * CW, hy: (row + 0.5) * LINE,
        r1: rand(), r2: rand(), r3: rand(), r4: rand(), d: rand() });
    }
    col++;
  }
}
const N = P.length, ORDER = P.map((_, i) => i);
const ROWS = SOURCE.split('\n').length;
P.forEach((p, i) => { p.i = i; p.k = (i + 0.5) / N; });
// Shuffled order for the shapes, so each glyph flies somewhere far from home.
{ const r = rng(99); const o = P.map((_, i) => i);
  for (let i = N - 1; i > 0; i--) { const j = r() * (i + 1) | 0; [o[i], o[j]] = [o[j], o[i]]; }
  o.forEach((q, i) => { P[q].s = i; P[q].u = (i + 0.5) / N; }); }

// ---- 3. a sprite atlas: every (character, color) drawn once, reused 60 times a second
const AT = 40, AW = Math.ceil(AT * 0.62), AH = Math.ceil(AT * 1.25);
const atlas = document.createElement('canvas'), SPR = new Map();
{
  const keys = [...new Set(P.map(p => p.ink + p.ch))];
  const per = 64;
  atlas.width = per * AW; atlas.height = Math.ceil(keys.length / per) * AH;
  const a = atlas.getContext('2d');
  a.font = `${AT}px ${MONO}`; a.textAlign = 'center'; a.textBaseline = 'middle';
  keys.forEach((k, n) => {
    const x = (n % per) * AW, y = (n / per | 0) * AH;
    a.fillStyle = INK[+k[0]]; a.fillText(k.slice(1), x + AW / 2, y + AH / 2);
    SPR.set(k, [x, y]);
  });
  P.forEach(p => { p.spr = SPR.get(p.ink + p.ch); });
}

// ---- 4. the music ----------------------------------------------------------------
// A four-chord loop in A minor, built from oscillators and noise, rendered offline.
const CHORDS = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];   // Am F C G
const ROOTS = [33, 29, 36, 31];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const KICKS = [];                              // the visuals read this too
const HITS = [4, 16];                          // the two drops
const STABS = [14, 15, 20, 24, 26];            // every time the words change
const TYPE0 = 29, TYPE1 = 30.8;                // the caption types itself back in

function arrangement(bar) {
  const drop = (bar >= 2 && bar <= 6) || (bar >= 8 && bar <= 11);
  return {
    kick: drop ? [0, 1, 2, 3] : bar === 12 || bar === 13 ? [0, 2] : [],
    clap: (bar >= 4 && bar <= 6) || (bar >= 8 && bar <= 11),
    hats: drop ? (bar >= 8 ? 16 : 8) : 0,
    bass: drop,
    lvl: drop ? 1 : bar === 7 || bar >= 12 && bar <= 13 ? 0.7 : 0.5,
    cut: [700, 1100, 1800, 2000, 2200, 2500, 2800, 900,
          3600, 3800, 4000, 4400, 1600, 1400, 800, 700][bar],
  };
}

async function makeMusic() {
  const TAIL = 2;                              // render past the end, then wrap it round
  const A = new OfflineAudioContext(2, SR * (LEN + TAIL), SR);
  const rand = rng(7);
  const noise = A.createBuffer(1, SR * 2, SR);
  noise.getChannelData(0).forEach((_, i, d) => { d[i] = rand() * 2 - 1; });

  const comp = A.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004;
  comp.connect(A.destination);
  const bus = (g0, to = comp) => {
    const n = A.createGain(); n.gain.value = g0; n.connect(to); return n;
  };
  const PAD = 0.15, mix = bus(0.9), pad = bus(PAD), arp = bus(0.10);
  const echo = A.createDelay(1); echo.delayTime.value = BEAT * 0.75;
  const fb = bus(0.32, echo); echo.connect(fb); echo.connect(bus(0.5, mix)); arp.connect(echo);

  function env(node, t, peak, att, hold, rel) {
    node.gain.setValueAtTime(0, t);
    node.gain.linearRampToValueAtTime(peak, t + att);
    node.gain.setTargetAtTime(0, t + att + hold, rel);
  }
  function osc(type, f, t, end, to, det = 0) {
    const o = A.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
    o.connect(to); o.start(t); o.stop(end); return o;
  }
  function filt(type, f, q, to) {
    const b = A.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
    b.connect(to); return b;
  }
  function hiss(t, dur, to) {
    const s = A.createBufferSource(); s.buffer = noise; s.connect(to);
    s.start(t, rand() * 1.5); s.stop(t + dur);
  }

  const kick = t => {
    const e = A.createGain(); e.connect(mix); env(e, t, 1.0, 0.002, 0.03, 0.09);
    const o = osc('sine', 160, t, t + 0.6, e);
    o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
    KICKS.push(t);
  };
  const hat = (t, v) => { const e = A.createGain(); env(e, t, v, 0.001, 0.005, 0.018);
    e.connect(mix); hiss(t, 0.12, filt('highpass', 7500, 0.7, e)); };
  const clap = t => { const e = A.createGain(); e.connect(mix);
    [0, 0.011, 0.023].forEach(o => e.gain.setValueAtTime(0.55, t + o));
    e.gain.setTargetAtTime(0, t + 0.03, 0.045); hiss(t, 0.35, filt('bandpass', 1500, 1.1, e)); };
  const pluck = (f, t, v, cut, to, type = 'square') => {
    const e = A.createGain(); env(e, t, v, 0.004, 0.02, 0.07); e.connect(to);
    osc(type, f, t, t + 0.6, filt('lowpass', cut, 2, e));
  };
  const riser = (t, dur) => {
    const e = A.createGain(); e.connect(mix);
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.35, t + dur);
    e.gain.setValueAtTime(0, t + dur);
    const b = filt('bandpass', 300, 3, e);
    b.frequency.setValueAtTime(300, t); b.frequency.exponentialRampToValueAtTime(7000, t + dur);
    hiss(t, dur, b);
  };
  const impact = t => {
    const e = A.createGain(); env(e, t, 0.9, 0.003, 0.05, 0.35); e.connect(mix);
    const o = osc('sine', 90, t, t + 2.5, e); o.frequency.exponentialRampToValueAtTime(28, t + 1.2);
    const n = A.createGain(); env(n, t, 0.5, 0.002, 0.02, 0.3); n.connect(mix);
    hiss(t, 1.8, filt('lowpass', 2500, 0.5, n));
  };
  const stab = t => {
    const bar = Math.floor(t / BAR) % 4;
    CHORDS[bar].forEach(m => [-9, 9].forEach(d => {
      const e = A.createGain(); env(e, t, 0.07, 0.003, 0.08, 0.12); e.connect(mix);
      osc('sawtooth', mtof(m + 12), t, t + 1, filt('lowpass', 3200, 1, e), d);
    }));
  };
  const key = t => { const e = A.createGain(); env(e, t, 0.18 + rand() * 0.12, 0.001, 0.004, 0.01);
    e.connect(mix); hiss(t, 0.05, filt('bandpass', 2500 + rand() * 2500, 2, e)); };

  const pump = pad.gain;
  for (let bar = 0; bar < 16; bar++) {
    const t0 = bar * BAR, a = arrangement(bar), ch = CHORDS[bar % 4];
    // pad: three detuned saws per chord tone
    const pe = A.createGain(); pe.connect(pad);
    pe.gain.setValueAtTime(0, t0); pe.gain.linearRampToValueAtTime(a.lvl, t0 + 0.04);
    pe.gain.setValueAtTime(a.lvl, t0 + BAR - 0.04); pe.gain.linearRampToValueAtTime(0, t0 + BAR);
    const pf = filt('lowpass', 900 + a.cut * 0.25, 0.8, pe);
    ch.forEach(m => [-11, 0, 11].forEach(d => osc('sawtooth', mtof(m), t0, t0 + BAR, pf, d)));
    // arpeggio: 16th notes climbing through the chord
    const up = [0, 1, 2, 3, 4, 5, 4, 3];
    for (let s = 0; s < 16; s++) {
      const n = up[s % 8], m = ch[n % 3] + 12 + 12 * Math.floor(n / 3);
      pluck(mtof(m), t0 + s * BEAT / 4, (s % 4 === 0 ? 1 : 0.7) * a.lvl, a.cut, arp);
    }
    for (const b of a.kick) kick(t0 + b * BEAT);
    if (a.clap) [1, 3].forEach(b => clap(t0 + b * BEAT));
    for (let s = 0; s < a.hats; s++) {
      const step = 16 / a.hats, t = t0 + s * step * BEAT / 4;
      if (a.hats === 16 || s % 2 === 1) hat(t, s % 2 ? 0.22 : 0.1);
    }
    if (a.bass) for (let s = 0; s < 8; s++) {
      const f = mtof(ROOTS[bar % 4] + (s % 2 ? 12 : 0));
      pluck(f, t0 + s * BEAT / 2, 0.55, 420, mix, 'sawtooth');
    }
  }
  // un-duck the pad between kicks
  KICKS.forEach(t => { pump.setValueAtTime(0.04, t); pump.linearRampToValueAtTime(PAD, t + 0.3); });
  HITS.forEach(impact);
  STABS.forEach(stab);
  riser(2.2, 1.8); riser(15, 1);
  for (let t = TYPE0; t < TYPE1; t += 0.043) key(t + rand() * 0.012);
  KICKS.sort((a, b) => a - b);

  const long = await A.startRendering(), buf = new AudioBuffer(
    { numberOfChannels: 2, length: SR * LEN, sampleRate: SR });
  let peak = 0;
  for (let c = 0; c < 2; c++) {                // echoes past the end ring out over the start
    const d = long.getChannelData(c).slice(0, SR * LEN), tail = long.getChannelData(c);
    for (let i = 0; i < SR * TAIL; i++) d[i] += tail[SR * LEN + i];
    d.forEach(v => { peak = Math.max(peak, Math.abs(v)); });
    buf.copyToChannel(d, c);
  }
  for (let c = 0; c < 2; c++) {                // normalize to -1 dBFS
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) d[i] *= 0.89 / peak;
  }
  return buf;
}

// ---- 5. listening to the music, so the glyphs can dance to it --------------------
let MUSIC = null;
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len;
    for (let i = 0; i < n; i += len) for (let k = 0; k < len / 2; k++) {
      const c = Math.cos(a * k), s = Math.sin(a * k), p = i + k, q = p + len / 2;
      const tr = re[q] * c - im[q] * s, ti = re[q] * s + im[q] * c;
      re[q] = re[p] - tr; im[q] = im[p] - ti; re[p] += tr; im[p] += ti;
    }
  }
}
const BANDS = 40, SPEC = new Float32Array(BANDS);
function listen(t) {
  if (!MUSIC) return;
  const n = 4096, re = new Float32Array(n), im = new Float32Array(n);
  const d = MUSIC.getChannelData(0), end = Math.floor(t * SR);
  for (let i = 0; i < n; i++) {
    const k = end - n + i;
    re[i] = (k >= 0 ? d[k] : 0) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / n));
  }
  fft(re, im);
  for (let b = 0; b < BANDS; b++) {
    const hz = k => 45 * Math.pow(12000 / 45, k / BANDS), lo = hz(b), hi = hz(b + 1);
    let m = 0, c = 0;
    for (let k = Math.floor(lo * n / SR); k <= Math.ceil(hi * n / SR); k++) {
      m += Math.hypot(re[k], im[k]); c++;
    }
    const db = 20 * Math.log10(m / c + 1e-9) + b * 0.45;          // gentle treble tilt
    SPEC[b] = clamp((db + 6) / 48);
  }
}
const kickAt = t => {
  let e = 0;
  for (const k of KICKS) if (k <= t) e = Math.exp(-(t - k) * 6); else break;
  return e;
};

// ---- 6. shapes. Each one says where glyph p should be at time t -----------------
// A shape returns [x, y, size, alpha]. Size 1 is the editor's font size.
const scroll = t => -600 + 26 * (t < LEN / 2 ? t : t - LEN);

const WALL = (p, t) => [p.hx, p.hy - scroll(t), 1, 1];

const SPHERE = (p, t) => {
  const y = 1 - 2 * p.u, r = Math.sqrt(1 - y * y), th = p.s * 2.39996323;
  const wob = 1 + 0.07 * Math.sin(5 * y + t * 3) + 0.09 * kickAt(t);
  let X = Math.cos(th) * r * wob, Y = y * wob, Z = Math.sin(th) * r * wob;
  const a = t * 0.7, b = 0.35;
  [X, Z] = [X * Math.cos(a) - Z * Math.sin(a), X * Math.sin(a) + Z * Math.cos(a)];
  [Y, Z] = [Y * Math.cos(b) - Z * Math.sin(b), Y * Math.sin(b) + Z * Math.cos(b)];
  const f = 2.6 / (2.6 + Z), R = 400;
  return [W / 2 + X * R * f, H / 2 + Y * R * f, 0.5 + 0.35 * f, clamp(0.25 + 0.75 * (1 - Z) / 2)];
};

const GALAXY = (p, t) => {
  const arm = p.s % 3, r = 30 + 500 * Math.pow(p.r1, 0.8);
  const th = arm * 2.0944 + r * 0.009 + t * (1.2 - r / 800) + (p.r2 - 0.5) * (1.7 - r / 500);
  const x = Math.cos(th) * r, z = Math.sin(th) * r;
  return [W / 2 + x, H / 2 + z * 0.62 + (p.r3 - 0.5) * 60 * (1 - r / 530),
    0.55 + 0.55 * (1 - r / 530), 0.6 + 0.4 * (1 - r / 530)];
};

const WORD_CACHE = new Map();
function WORDS(...lines) {
  return (p, t) => {
    const key = lines.join('|');
    if (!WORD_CACHE.has(key)) WORD_CACHE.set(key, sampleText(lines));
    const pts = WORD_CACHE.get(key), q = (p.s % (pts.length / 2)) * 2;
    return [pts[q] + (p.r1 - 0.5) * 3 + Math.sin(t * 3 + p.r2 * 6) * 1.5,
            pts[q + 1] + (p.r3 - 0.5) * 3, 0.7, 1];
  };
}
function sampleText(lines) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  let size = 240;
  x.font = `900 ${size}px ${SANS}`;
  const widest = Math.max(...lines.map(s => x.measureText(s).width));
  size = Math.min(size, size * 960 / widest);
  x.font = `900 ${size}px ${SANS}`;
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  lines.forEach((s, i) => x.fillText(s, W / 2, H / 2 + (i - (lines.length - 1) / 2) * size * 1.1));
  const d = x.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += 3) for (let k = 0; k < W; k += 3)
    if (d[(y * W + k) * 4 + 3] > 140) pts.push(k, y);
  return pts;
}

const BARS = (p, t) => {
  const b = Math.floor(p.r2 * BANDS), h = 18 + SPEC[b] * 560, bw = 960 / BANDS;
  return [60 + (b + 0.5) * bw + (p.r1 - 0.5) * bw * 0.7,
          H / 2 + (p.r4 < 0.5 ? -1 : 1) * p.r3 * h, 0.55, 0.75];
};

const RING = (p, t) => {
  const b = Math.floor(p.r2 * BANDS), side = p.r4 < 0.5 ? -1 : 1;
  const th = side * (b + 0.5 + (p.r1 - 0.5) * 0.7) / BANDS * Math.PI - Math.PI / 2 + t * 0.25;
  const r = 250 * (1 + 0.08 * kickAt(t)) + p.r3 * (12 + SPEC[b] * 330);
  return [W / 2 + Math.cos(th) * r, H / 2 + Math.sin(th) * r, 0.55, 0.8];
};

// ---- 7. the score for the picture: when each shape takes over -------------------
const GLYPHS = N.toLocaleString('en-US') + ' GLYPHS';
const SCENES = [
  { t: 0, dur: 0, shape: WALL },
  { t: 4, dur: 1.4, shape: SPHERE },
  { t: 9.5, dur: 1.3, shape: GALAXY },
  { t: 14, dur: 0.75, shape: WORDS('THE MUSIC?') },
  { t: 15, dur: 0.6, shape: WORDS('ALSO', 'CODE.') },
  { t: 16, dur: 0.8, shape: BARS },
  { t: 20, dur: 1.0, shape: RING },
  { t: 24, dur: 0.8, shape: WORDS('0 IMAGES', '0 AUDIO FILES', '0 VIDEO MODELS') },
  { t: 26, dur: 0.8, shape: WORDS('1 FILE', GLYPHS) },
  { t: 28, dur: 1.8, shape: WALL },
];

function place(p, t) {
  let i = SCENES.length - 1;
  while (SCENES[i].t > t) i--;
  const S = SCENES[i], B = S.shape(p, t);
  const u0 = (t - S.t - p.d * S.dur * 0.4) / (S.dur * 0.6);
  if (i === 0 || u0 >= 1) return [...B, 0];
  const u = ease(clamp(u0)), A = SCENES[i - 1].shape(p, t), arc = Math.sin(Math.PI * u);
  const dx = B[0] - A[0], dy = B[1] - A[1], side = (p.r4 - 0.5) * 0.9;
  return [lerp(A[0], B[0], u) - dy * side * arc, lerp(A[1], B[1], u) + dx * side * arc,
          lerp(A[2], B[2], u) * (1 + 0.6 * arc), lerp(A[3], B[3], u), arc * (p.r1 - 0.5) * 7];
}

// ---- 8. draw one frame ---------------------------------------------------------
const HOOK = ['this video is made of', 'its own source code'];
const SUB = 'every glyph = one character of the program drawing it';

function frame(t) {
  t = ((t % LEN) + LEN) % LEN;
  listen(t);
  const kick = kickAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = BG; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900);
  glow.addColorStop(0, `rgba(90, 70, 190, ${0.1 + 0.18 * kick})`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

  // the glyphs, far ones first
  const shake = clamp((t - 3.1) / 0.9) * (t < 4.2 ? 1 : 0), sw = FONT / AT;
  for (const p of P) {
    let [x, y, s, a, rot] = place(p, t);
    if (shake) { x += (p.r1 - 0.5) * 9 * shake * Math.sin(t * 90 + p.r2 * 50);
                 y += (p.r3 - 0.5) * 9 * shake; rot += (p.r4 - 0.5) * 0.5 * shake; }
    p.x = x; p.y = y; p.z = s; p.a = a; p.rot = rot;
  }
  ORDER.sort((a, b) => P[a].z - P[b].z);
  for (const i of ORDER) {
    const p = P[i];
    if (p.y < -30 || p.y > H + 30 || p.x < -30 || p.x > W + 30) continue;
    const k = p.z * sw, c = Math.cos(p.rot) * k, n = Math.sin(p.rot) * k;
    g.setTransform(c, n, -n, c, p.x, p.y);
    g.globalAlpha = p.a;
    g.drawImage(atlas, p.spr[0], p.spr[1], AW, AH, -AW / 2, -AH / 2, AW, AH);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;

  // the caption: on screen at the start, fades on the drop, types itself back in at the end
  let shown = HOOK.join('\n').length, alpha = 1;
  if (t >= 3.5 && t < TYPE0) alpha = clamp(1 - (t - 3.5) / 0.4);
  if (t >= TYPE0) shown = Math.floor((t - TYPE0) / (TYPE1 - TYPE0) * shown);
  if (alpha > 0) caption(shown, alpha, t);

  // the heads-up display, for the nerds
  g.font = `600 22px ${MONO}`; g.textAlign = 'left'; g.fillStyle = 'rgba(200,211,245,0.55)';
  const fr = String(Math.round(t * FPS)).padStart(3, '0');
  g.fillText(`made_of_code.js  frame ${fr}/${LEN * FPS}  ${N.toLocaleString('en-US')} glyphs`,
    LEFT, 205);
  g.fillStyle = `rgba(255,121,198,${0.35 + 0.65 * kick})`;
  g.fillRect(LEFT, 222, (W - 2 * LEFT) * t / LEN, 4);
}

function caption(shown, alpha, t) {
  const full = HOOK.join('\n').length, blink = shown < full && Math.floor(t * 5) % 2 === 0;
  g.globalAlpha = alpha;
  g.fillStyle = 'rgba(7,8,12,0.82)';
  round(40, 268, W - 80, 290, 28); g.fill();
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = `800 70px ${SANS}`;
  let left = shown;
  HOOK.forEach((line, i) => {
    let s = line.slice(0, Math.max(0, left));
    if (blink && left >= 0 && left <= line.length) s += '|';
    left -= line.length + 1;
    g.fillStyle = i ? '#ff79c6' : '#ffffff';
    g.fillText(s, W / 2, 360 + i * 86);
  });
  g.font = `500 27px ${SANS}`; g.fillStyle = 'rgba(200,211,245,0.8)';
  if (shown >= full) g.fillText(SUB, W / 2, 522);
  g.globalAlpha = 1;
}
function round(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
}

// ---- 9. play it --------------------------------------------------------------------
async function prepare() {
  MUSIC = await makeMusic();
  frame(0);
  return { n: N, rows: ROWS, chars: SOURCE.length };
}
window.prepare = prepare;
window.frame = frame;
window.music = () => MUSIC;

if (!RENDER) {
  const veil = msg => {
    g.fillStyle = 'rgba(7,8,12,0.55)'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#fff'; g.font = `800 64px ${SANS}`; g.textAlign = 'center';
    g.fillText(msg, W / 2, H / 2 + 300);
  };
  frame(0); veil('composing the music...');
  const ready = prepare().then(() => { frame(0); veil('▶  tap to play'); });
  let ctx = null;
  cv.addEventListener('click', async () => {
    if (ctx) { ctx.state === 'running' ? ctx.suspend() : ctx.resume(); return; }
    ctx = new AudioContext({ sampleRate: SR });
    await ready;
    const src = ctx.createBufferSource(); src.buffer = MUSIC; src.loop = true;
    src.connect(ctx.destination);
    const t0 = ctx.currentTime + 0.05; src.start(t0);
    const tick = () => { frame(Math.max(0, ctx.currentTime - t0)); requestAnimationFrame(tick); };
    tick();
  });
}
// The end. Or the beginning, since it loops.
</script>
